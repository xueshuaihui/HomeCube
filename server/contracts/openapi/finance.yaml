# Finance OpenAPI 契约
# CONTRACT FROZEN: P1-M2 closeout (S19)
# Any breaking change requires version bump and deprecation period per PRD 10.4
frozen_at: "2026-10-03"
version: "1.0.0"
# 路由前缀: /api/finance/*
# 服务: svc-finance
# 版本: 1.0

openapi: "3.0.3"
info:
  title: Finance API
  version: "1.0"
  description: >
    财务面服务接口，负责记账、账户、分类、预算、账单等财务管理能力。
    所有接口均需携带 JWT token（除健康检查外）。

servers:
  - url: /api/finance

paths:
  # === 健康检查 ===
  /healthz:
    get:
      summary: 健康检查
      description: 报告本服务的 schema 连接状态与 JetStream 连接状态
      operationId: getHealthz
      tags:
        - system
      responses:
        '200':
          description: 服务健康
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [healthy]
                  checks:
                    type: object
                    properties:
                      schema:
                        type: object
                        properties:
                          connected:
                            type: boolean
                          current_schema:
                            type: string
                          tables_exist:
                            type: boolean
                      jetstream:
                        type: object
                        properties:
                          connected:
                            type: boolean
                          account_info:
                            type: object
        '503':
          description: 服务不健康

  # === 流水管理 ===
  /transactions:
    get:
      summary: 流水列表
      description: 游标分页的流水列表，支持按 period/type/category/account 筛选
      operationId: listTransactions
      tags:
        - transactions
      security:
        - bearerAuth: []
      parameters:
        - name: period
          in: query
          required: false
          schema:
            type: string
            pattern: '^\\d{4}-(\\d{2}|Q[1-4])$'
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [income, expense, transfer]
        - name: category_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: account_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 流水列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Transaction'
                  next_cursor:
                    type: string
                    nullable: true

    post:
      summary: 记账
      description: >
        创建新流水（收支/转账）。带 client_request_id 实现幂等。
        金额以分为单位（amount_cents），禁止浮点。
      operationId: createTransaction
      tags:
        - transactions
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, amount_cents, account_id, occurred_at]
              properties:
                type:
                  type: string
                  enum: [income, expense, transfer]
                amount_cents:
                  type: integer
                account_id:
                  type: string
                  format: uuid
                target_account_id:
                  type: string
                  format: uuid
                  description: 转账时必填
                category_id:
                  type: string
                  format: uuid
                occurred_at:
                  type: string
                  format: date-time
                note:
                  type: string
                receipt_file_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                  maxItems: 3
                client_request_id:
                  type: string
                  format: uuid
                  description: 幂等键。格式必须为 uuid —— `finance.finance_transaction.client_request_id` 的列类型就是 uuid（迁移 finance_0001_base_schema），非 UUID 串会被 PostgreSQL 拒绝（SQLSTATE 22P02）。
                ledger_id:
                  type: string
                  format: uuid
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '409':
          description: 幂等冲突（返回首次响应）

  /transactions/{id}:
    get:
      summary: 单条流水查询
      operationId: getTransaction
      tags:
        - transactions
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 流水详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '404':
          description: 流水不存在或已删除

    put:
      summary: 编辑流水
      description: 乐观锁更新，version 不匹配返回 409 + 双版本 payload
      operationId: updateTransaction
      tags:
        - transactions
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version:
                  type: integer
                amount_cents:
                  type: integer
                category_id:
                  type: string
                  format: uuid
                occurred_at:
                  type: string
                  format: date-time
                note:
                  type: string
                receipt_file_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '409':
          description: 版本冲突
          content:
            application/json:
              schema:
                type: object
                properties:
                  server_version:
                    type: integer
                  client_version:
                    type: integer
                  server_payload:
                    $ref: '#/components/schemas/Transaction'
                  client_payload:
                    $ref: '#/components/schemas/Transaction'

    delete:
      summary: 软删流水
      description: 进入回收站，30天内可恢复
      operationId: deleteTransaction
      tags:
        - transactions
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: 删除成功
        '404':
          description: 流水不存在

  # === 账户管理 ===
  /accounts:
    get:
      summary: 账户列表
      description: 返回预置账户与自定义账户，含余额（派生值）
      operationId: listAccounts
      tags:
        - accounts
      security:
        - bearerAuth: []
      parameters:
        - name: include_archived
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: 账户列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Account'

    post:
      summary: 创建账户
      operationId: createAccount
      tags:
        - accounts
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type]
              properties:
                name:
                  type: string
                type:
                  type: string
                  enum: [cash, bank, third_party, credit_card]
                initial_balance_cents:
                  type: integer
                  default: 0
                icon:
                  type: string
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'

  # === 分类管理 ===
  /categories:
    get:
      summary: 分类列表
      description: 系统预置字典 + 家庭自定义二级分类
      operationId: listCategories
      tags:
        - categories
      security:
        - bearerAuth: []
      parameters:
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [income, expense]
        - name: include_inactive
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: 分类列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'

    post:
      summary: 创建自定义分类
      operationId: createCategory
      tags:
        - categories
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type]
              properties:
                name:
                  type: string
                type:
                  type: string
                  enum: [income, expense]
                parent_id:
                  type: string
                  format: uuid
                  nullable: true
                icon:
                  type: string
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'

  # === 预算管理 ===
  /budgets:
    get:
      summary: 预算列表
      description: 按 period 过滤的预算列表
      operationId: listBudgets
      tags:
        - budgets
      security:
        - bearerAuth: []
      parameters:
        - name: period
          in: query
          required: false
          schema:
            type: string
            pattern: '^\\d{4}-(\\d{2}|Q[1-4])$'
      responses:
        '200':
          description: 预算列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Budget'

    post:
      summary: 创建预算
      description: 月度 + 分类 + 固定/周期预算
      operationId: createBudget
      tags:
        - budgets
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category_id, amount_cents, period]
              properties:
                category_id:
                  type: string
                  format: uuid
                amount_cents:
                  type: integer
                period:
                  type: string
                recurring:
                  type: boolean
                  default: false
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Budget'

  # === 账单管理 ===
  /bills:
    get:
      summary: 账单列表
      description: 按 due_at/period/status 筛选
      operationId: listBills
      tags:
        - bills
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, paid, overdue]
        - name: period
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: 账单列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Bill'

    post:
      summary: 创建账单
      description: 新建账单并注册到期中心
      operationId: createBill
      tags:
        - bills
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, amount_cents, due_at]
              properties:
                title:
                  type: string
                amount_cents:
                  type: integer
                due_at:
                  type: string
                  format: date-time
                category_id:
                  type: string
                  format: uuid
                recurring:
                  type: boolean
                  default: false
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bill'

  # === 数据导出 ===
  /export:
    get:
      summary: 数据导出
      description: >
        三参数必须全生效：type（导出类型）、days（时间范围）、format（文件格式）。
        非法参数组合返回 400。
      operationId: exportData
      tags:
        - export
      security:
        - bearerAuth: []
      parameters:
        - name: type
          in: query
          required: true
          schema:
            type: string
            enum: [transactions, budget, full]
        - name: days
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 365
        - name: format
          in: query
          required: true
          schema:
            type: string
            enum: [csv, excel, pdf]
      responses:
        '200':
          description: 导出文件
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: 参数格式非法

  # === 回收站管理 ===
  /trash:
    get:
      summary: 回收站列表
      description: 查询已删除但未过期的记录（保留30天）
      operationId: listTrash
      tags:
        - trash
      security:
        - bearerAuth: []
      parameters:
        - name: family_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [transaction, category, account, budget, bill]
      responses:
        '200':
          description: 回收站列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/TrashItem'

  /trash/{id}/restore:
    post:
      summary: 恢复回收站记录
      description: 将已删除的记录恢复到正常状态
      operationId: restoreTrashItem
      tags:
        - trash
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                family_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: 恢复成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '404':
          description: 记录不存在或已过期
        '500':
          description: 恢复失败

  /trash/{id}:
    delete:
      summary: 彻底删除回收站记录
      description: 永久删除记录，不可恢复
      operationId: permanentlyDeleteTrashItem
      tags:
        - trash
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                family_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: 永久删除成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '404':
          description: 记录不存在
        '500':
          description: 删除失败

  /trash/clear-expired:
    post:
      summary: 清空过期回收站记录
      description: 清除所有已过期的回收站记录（超过30天）
      operationId: clearExpiredTrash
      tags:
        - trash
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                family_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: 清空成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  count:
                    type: integer
                    description: 清空的记录数量

components:
  schemas:
    Transaction:
      type: object
      properties:
        id:
          type: string
          format: uuid
        family_id:
          type: string
          format: uuid
        type:
          type: string
          enum: [income, expense, transfer]
        amount_cents:
          type: integer
        account_id:
          type: string
          format: uuid
        target_account_id:
          type: string
          format: uuid
          nullable: true
        category_id:
          type: string
          format: uuid
          nullable: true
        occurred_at:
          type: string
          format: date-time
        note:
          type: string
          nullable: true
        receipt_file_ids:
          type: array
          items:
            type: string
            format: uuid
        version:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
          nullable: true
        deleted_by:
          type: string
          format: uuid
          nullable: true

    Account:
      type: object
      properties:
        id:
          type: string
          format: uuid
        family_id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
          enum: [cash, bank, third_party, credit_card]
        balance_cents:
          type: integer
          description: 派生值，按 amount_cents 累计
        icon:
          type: string
        is_archived:
          type: boolean
        archived_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
        family_id:
          type: string
          format: uuid
          nullable: true
          description: 可空 = 系统预置
        name:
          type: string
        type:
          type: string
          enum: [income, expense]
        parent_id:
          type: string
          format: uuid
          nullable: true
        icon:
          type: string
        is_active:
          type: boolean
          default: true
        sort_order:
          type: integer
        version:
          type: integer

    Budget:
      type: object
      properties:
        id:
          type: string
          format: uuid
        family_id:
          type: string
          format: uuid
        category_id:
          type: string
          format: uuid
        amount_cents:
          type: integer
        period:
          type: string
        spent_cents:
          type: integer
        remaining_cents:
          type: integer
        exceeded:
          type: boolean
        recurring:
          type: boolean

    Bill:
      type: object
      properties:
        id:
          type: string
          format: uuid
        family_id:
          type: string
          format: uuid
        title:
          type: string
        amount_cents:
          type: integer
        due_at:
          type: string
          format: date-time
        paid_at:
          type: string
          format: date-time
          nullable: true
        transaction_id:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum: [pending, paid, overdue]
        recurring:
          type: boolean
        created_at:
          type: string
          format: date-time

    TrashItem:
      type: object
      description: 回收站中的已删除记录
      properties:
        id:
          type: string
          format: uuid
          description: 原始记录ID
        family_id:
          type: string
          format: uuid
        original_type:
          type: string
          enum: [transaction, category, account, budget, bill]
          description: 原始记录类型
        original_id:
          type: string
          format: uuid
          description: 原始记录的UUID
        deleted_at:
          type: string
          format: date-time
          description: 删除时间
        expires_at:
          type: string
          format: date-time
          description: 过期时间（删除后30天）
        data:
          type: object
          description: 原始记录的完整数据快照
        can_restore:
          type: boolean
          description: 是否可恢复（未过期）

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
