# Nginx config for web H5 static container
server {
    listen 80;
    server_name _;

    # Set proper content types and charset for Vue SPA
    default_type application/octet-stream;
    charset utf-8;
    charset_types text/html text/css application/javascript application/json image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for better performance
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_vary on;

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: all routes go to index.html (hash mode routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint
    location /healthz {
        access_log off;
        return 200 '{"status":"ok","service":"web"}';
        add_header Content-Type application/json;
    }
}
