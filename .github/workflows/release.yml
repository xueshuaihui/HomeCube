# 发版构建：base_v<x.y.z> 标签（或手动触发）→ 测试 → 构建 H5 基座 + 唯一清单 → GitHub Release。
#
# 与上一版的区别（2026-10-26 复核后重写）：
#   - 只发基座：P1 的财务分包随基座发布（PRD 17.8），不再有 finance_v* 独立面包；
#   - 不再向 OSS/CDN 上传、不再调用不存在的 /admin/versions、不再发 Slack——
#     本仓没有这些凭据与端点，写了也只是永远不执行的假步骤；
#   - 测试去掉 `|| true`：失败就是失败；
#   - 产物是 zip + manifest.json，Zip 的 mtime 已在 build-base.sh 里归一化，可复核；
#   - 生成物漂移检查：提交进仓库的 bundle_manifest.json（除 generated_at）与
#     web/generated/domains.json 必须与本次构建一致，否则打出的二进制会发布过期的 sha256；
#   - 标签触发固定用 MIN_COMPAT=1.0.0；破坏性变更请用手动触发并填 min_compat。
#
# 部署仍由人手动完成（本仓公开，不放服务器路径与凭据）：把 dist/releases/ 按 /releases/ 布局
# 放到 nginx 静态根，二进制由同一次构建的源码编译。命令见 docs/RELEASE-PROCESS.md。

name: Release

on:
  push:
    tags:
      - 'base_v*'
  workflow_dispatch:
    inputs:
      version:
        description: '语义版本 x.y.z（创建/使用标签 base_v<x.y.z>）'
        required: true
        type: string
      min_compat:
        description: '最低兼容版本；普通发版保持 1.0.0，破坏性变更才提高'
        required: false
        default: '1.0.0'
        type: string
      release_notes:
        description: '更新说明（写入清单 update_notes 与 Release 正文）'
        required: false
        default: 'P1：HomeOS 基座 + 财务管理面'
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 解析版本
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_MIN_COMPAT: ${{ inputs.min_compat }}
          INPUT_RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#base_v}"
            MIN_COMPAT="1.0.0"
            NOTES="P1：HomeOS 基座 + 财务管理面"
          else
            VERSION="${INPUT_VERSION}"
            MIN_COMPAT="${INPUT_MIN_COMPAT}"
            NOTES="${INPUT_RELEASE_NOTES}"
            TAG="base_v${VERSION}"
          fi
          if ! printf '%s' "${VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "版本必须是 x.y.z（收到：${VERSION}）" >&2
            exit 1
          fi
          if ! printf '%s' "${MIN_COMPAT}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "min_compat 必须是 x.y.z（收到：${MIN_COMPAT}）" >&2
            exit 1
          fi
          {
            echo "version=${VERSION}"
            echo "tag=${TAG}"
            echo "min_compat=${MIN_COMPAT}"
            echo "notes<<NOTES_EOF"
            printf '%s\n' "${NOTES}"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: 后端测试
        working-directory: server
        env:
          GOTOOLCHAIN: local
        run: go test ./...

      - name: 构建基座与分包清单
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          MIN_COMPAT: ${{ steps.meta.outputs.min_compat }}
          RELEASE_NOTES: ${{ steps.meta.outputs.notes }}
        run: bash scripts/build-base.sh "${VERSION}"

      - name: 生成物与提交内容一致
        run: |
          set -euo pipefail
          MANIFEST="server/services/svc-homeos/internal/handler/bundle_manifest.json"
          DOMAINS="web/generated/domains.json"
          COMMITTED_MANIFEST="$(git show "HEAD:${MANIFEST}")"
          BUILT_MANIFEST="$(cat "${MANIFEST}")"
          COMMITTED_DOMAINS="$(git show "HEAD:${DOMAINS}")"
          BUILT_DOMAINS="$(cat "${DOMAINS}")"
          if ! COMMITTED_MANIFEST="${COMMITTED_MANIFEST}" BUILT_MANIFEST="${BUILT_MANIFEST}" \
               COMMITTED_DOMAINS="${COMMITTED_DOMAINS}" BUILT_DOMAINS="${BUILT_DOMAINS}" \
               node --input-type=module -e '
          const canon = (v) => Array.isArray(v)
            ? v.map(canon)
            : v && typeof v === "object"
              ? Object.fromEntries(Object.keys(v).sort().map((k) => [k, canon(v[k])]))
              : v;
          const strip = (s) => {
            const d = JSON.parse(s);
            delete d.generated_at;
            return JSON.stringify(canon(d));
          };
          if (strip(process.env.COMMITTED_MANIFEST) !== strip(process.env.BUILT_MANIFEST)) {
            console.error("bundle_manifest.json 与本次构建结果不一致（除 generated_at 外必须逐字段相同）");
            process.exit(1);
          }
          if (JSON.stringify(canon(JSON.parse(process.env.COMMITTED_DOMAINS))) !==
              JSON.stringify(canon(JSON.parse(process.env.BUILT_DOMAINS)))) {
            console.error("web/generated/domains.json 与本次 registry 导出一致性检查失败");
            process.exit(1);
          }
          '; then
            echo "先在本地运行 bash scripts/build-base.sh <版本> 并提交生成的 bundle_manifest.json 与 domains.json，再打标签。" >&2
            exit 1
          fi

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: homecube-base-${{ steps.meta.outputs.version }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/releases/manifest.json
            dist/releases/base/${{ steps.meta.outputs.version }}/homecube-base-${{ steps.meta.outputs.version }}.zip

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          ZIP="dist/releases/base/${VERSION}/homecube-base-${VERSION}.zip"
          SHA="$(node -p 'require("./dist/releases/manifest.json").base.sha256')"
          cat > release-notes.md <<EOF
          ## ${TAG}

          基座 H5 构建 + 分包清单。P1 的财务分包随基座一起发布（PRD 17.8）。

          - 包：\`homecube-base-${VERSION}.zip\`
          - 清单：\`manifest.json\`
          - sha256：\`${SHA}\`

          手动发布到服务器：

          \`\`\`bash
          rsync -av --delete dist/releases/ <user>@<host>:<WEB_ROOT>/
          bash scripts/verify-release.sh dist/releases/manifest.json <WEB_ROOT>
          \`\`\`

          服务器上的 nginx 需要把 \`/releases/\` 指向 \`<WEB_ROOT>\`；svc-homeos 二进制必须与本次
          构建同源（其内嵌的 bundle_manifest.json 必须逐字段等于随附件发布的 manifest.json）。
          EOF
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${ZIP}" dist/releases/manifest.json --clobber
          else
            gh release create "${TAG}" "${ZIP}" dist/releases/manifest.json \
              --title "${TAG}" --notes-file release-notes.md --target "${GITHUB_SHA}"
          fi
