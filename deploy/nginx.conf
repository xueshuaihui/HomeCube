# =============================================================================
# HomeCube · Nginx 前缀反向代理 + H5 静态产物
#
# 条款权威源：docs/p1-tech-plan.md §1.1（「不设网关服务：Nginx 只做前缀转发、TLS 与静态资源，
# 不做鉴权……未出生面的 /api/{code}/ 前缀由 Nginx 直接返回『即将上线』」，拓扑图同节：
# 「其余五个前缀 → 404『即将上线』」）、§1.2（deploy/ 内容登记项之一即 nginx.conf）、
# §九 与 PRD 17.7 第 5 条（客户端只对一个 base URL，由 Nginx 前缀反代）、
# PRD 17.8 与 17.2 的四词分工（定版 ㉙）。
#
# 三态用词的边界（本文件只兑现第一条，其余两条不在本卡）：
#   · 「即将上线」= 这个面还没出生 —— 无容器、无上游，由本文件的 @hc_unborn 直接兜住。
#   · 「未启用」= 本家庭没挂载该面（homeos_family_module 无行）—— 前缀与服务都在，
#     由该服务自己的中间件按 scope=module 拒绝并落审计（PRD 17.8、技术方案 §4.2、S4 鉴权卡）。
#     本文件**不判断**、也判断不了这件事（它不知道 family_id，也不得鉴权，§1.1）。
#   · 「暂不可用」/「依赖未就绪」= 服务侧与客户端呈现层的状态（PRD 17.2、12.3、定版 ㉙），
#     本文件不产出这两个词。
#
# 本文件是什么形状：一个 **http 层级片段**（不是完整 nginx 主配置，没有 events{}/http{}），
# 由官方 nginx 镜像的 /docker-entrypoint.d/20-envsubst-on-templates.sh 在容器启动时做变量替换，
# 生成 /etc/nginx/conf.d/default.conf（挂载时故意用 default.conf.template 这个basename，
# 目的是**顶掉镜像自带的 default server**——否则两份都 listen 80，静态与代理段会被镜像默认页遮住），
# 再由主配置的 http{} include /etc/nginx/conf.d/*.conf 收进来（挂载点见 docker-compose.yml）。
# 因此下面出现的 ${HOMEOS_UPSTREAM} / ${FINANCE_UPSTREAM} 不是 nginx 变量，
# 而是 **env 变量**：值来自 deploy/env.local（键的登记与说明见 deploy/env.local.example）。
# 该脚本只替换「容器里已定义的环境变量」，所以下面的 $host / $uri / $scheme 这些
# nginx 自带变量不会被吃掉（这是官方镜像的既有行为，本卡的实测见判据 D）。
# 这样「上游地址」这一处命名只有一个源，D-b 把宿主 dev 口换成容器名时**只改 env，不改本文件**
# —— 这也是 §1.1「未出生面不得为凑齐路由而留空服务容器」的另一半：出生期到了不需要动代理配置。
# 校验：容器内 nginx -t（本卡判据 D 的实测输出在交付报告里）。
# =============================================================================

# ---- 已出生面的上游（§1.1 当期两个：svc-homeos、svc-finance）----------------
# 地址只在这两个 upstream 块里出现一次，location 段只写名字（这就是「上游地址用变量声明」）。
# 值是 host:port 形态，来自 env：本地形态是宿主 make dev-{code} 跑出来的进程
# （§十三），D-b 起换成容器名 svc-{code}:{port}（registry.Domain.ServiceName，§1.3 第 1 行）。
upstream hc_svc_homeos {
    server ${HOMEOS_UPSTREAM};
}

upstream hc_svc_finance {
    server ${FINANCE_UPSTREAM};
}

# ---- web 静态容器上游（S1-D-b 新增）-----------------------------------------
# D-b 的 web 静态容器通过 compose 服务名解析，固定 listen 80。
upstream hc_web {
    server web:80;
}

# 访问日志带上 $upstream_addr：这是「未出生前缀不落到任何服务」的可复核证据位
# —— 兜「即将上线」的五条路径（当期未出生面五个，见生成文件）里这一列恒为 "-"，
# 而代理成功时它是真实上游 host:port。
# 没有这一列时 access.log 只能看出状态码，看不出请求到底有没有出门（§1.1）。
log_format hc_upstream '$remote_addr - [$time_local] "$request" '
                       'status=$status upstream=$upstream_addr upstream_status=$upstream_status';

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/homecube.access.log hc_upstream;

    # 「即将上线」响应体是中文 JSON：不给 charset 时客户端按 latin-1 解就成乱码。
    # 官方镜像的 default_type 是 text/plain 且 charset_types 不含 application/json，
    # 所以三行一起写（PRD 12.4 的中文文案要求与 3.7 的 JSON 接口形态在此处的载体）。
    # text/html 不在列表里是故意的：charset 模块本就恒带它，再写一次 nginx -t 会报
    # duplicate MIME type 警告。
    default_type application/json;
    charset utf-8;
    charset_types application/json text/css text/plain;

    # 票据附件限额：PRD 3.6 File 行与 14.7「单笔 ≤3 张、单张 ≤5MB」= 单次请求体上限 15MB，
    # 留出包装余量取 16m。nginx 默认 1m 会让 S11-S12 的附件上传直接 413 ——
    # 超限由服务端按 3.6 的业务规则判定，不由这里先拦（本行只保证不无辜截断）。
    client_max_body_size 16m;

    # 未出生面的 418 只是「跳到共享响应」的内部信令，不对客户端出现：
    # error_page 把它归并成一条 404 + 「即将上线」（§1.1 拓扑图的「404『即将上线』」）。
    # 面清单不在本文件里 —— 见下面 include 的那个生成文件。
    error_page 418 = @hc_unborn;

    # ---- 已出生面：前缀原样转发，不鉴权、不改写路径 --------------------------
    # 两个 location 的前缀 = registry.Domain.RoutePrefix（/api/{code}/，PREFIX 形态，
    # registry.go 的 Domain 注释说明 nginx 用这一形态）。当期实建两域只有 homeos 与 finance
    # （PRD 卷首第 12 项、定版 E ★），所以这里就是两段；面出生期到了新增一段。
    # 服务的 Gin 路由组本身就挂在 RoutePrefix 上（server/packages/obs/serve.go 的 newEngine），
    # 因此 proxy_pass 不带 URI 段：原始 /api/homeos/healthz 原样送达，不做前缀剥离。
    # §1.1「不做鉴权」：这里没有 JWT 校验、没有 auth_request、没有角色判断，
    # 鉴权在每个服务自己的中间件里由同一 SDK 完成（S4 卡）。
    location /api/homeos/ {
        proxy_pass http://hc_svc_homeos;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /api/finance/ {
        proxy_pass http://hc_svc_finance;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # ---- 未出生面：直接 404「即将上线」，不落到任何服务 ----------------------
    # 本文件 include 的是一个生成片段：每行 location /api/{code}/ { return 418; }，
    # 面集合与路径逐值取自 registry（deploy/nginx.unborn.conf 头部记着命令与来源字段），
    # 手抄一份 code 清单就是 §1.3「一张域表是唯一真源」禁止的第二真源。
    # 重生成：node deploy/gen-nginx-unborn.mjs（make up 每次都现取现覆写）。
    include /etc/nginx/homecube/unborn.conf;

    # ---- 未登记的 code 前缀：既不是出生面也不是未出生面 ----------------------
    # 兜在两段之后：/api/foo/ 不代理、也不兜「即将上线」（「即将上线」只属于 registry
    # 登记过的七个 code，PRD 17.2 四词分工），也不让 SPA 壳接住 API 路径。
    location /api/ {
        return 404 '{"error":"not_found","detail":"registry 未登记的接口前缀"}';
    }

    # ---- H5 静态产物（§1.1 的「静态资源」职责）------------------------------
    # D-b 起使用 web 静态容器（§10.1），通过 upstream 代理到 web 服务。
    # manifest.json 的 h5.router.mode 是 hash，所以任何前端路由都落在 /index.html 上；
    # try_files 的末段只是给直接敲子路径的兜底，不改变 hash 路由事实。
    location / {
        proxy_pass http://hc_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- 共享的「即将上线」响应体（用词见 PRD 17.2 定版 ㉙、17.7 第 2 条）----
    # 文案只写这一处；生成片段只给前缀。404 是 §1.1 拓扑图登记的码。
    location @hc_unborn {
        return 404 '{"status":"unborn","message":"即将上线"}';
    }
}
