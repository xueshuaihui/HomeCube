<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>设置 · 家立方原型</title>
<link rel="stylesheet" href="shared/tokens.css">
<link rel="stylesheet" href="shared/base.css">
<script src="shared/app.js" defer></script>
<style>
  .set-body { padding-bottom: 32px; }
  .set-intro {
    margin: 4px 0 4px; padding: 12px 14px;
    border-radius: var(--radius-md);
    background: var(--surface-2);
    font-size: var(--fs-12); line-height: var(--lh-loose); color: var(--text-2);
  }
  .set-theme { padding: 14px 16px; }
  .set-theme-row { display: flex; align-items: center; gap: 12px; }
  .set-theme-row .set-label { flex: 1; min-width: 0; font-size: var(--fs-15); font-weight: 600; }
  .set-theme-row .set-label .li-sub { display: block; font-size: var(--fs-12); font-weight: 400; color: var(--text-3); margin-top: 2px; }
  .set-theme-row .segmented button { padding: 7px 11px; }
  .set-theme-note {
    display: none; margin-top: 12px; padding: 8px 10px;
    border-radius: var(--radius-sm);
    background: var(--brand-soft); color: var(--brand-text);
    font-size: var(--fs-12);
  }
  body[data-state="dark"] .set-theme-note { display: block; }
  .set-flag {
    flex: none; padding: 1px 6px; border-radius: var(--radius-pill);
    background: var(--surface-2); color: var(--text-3);
    font-size: var(--fs-11); font-weight: 600; white-space: nowrap;
  }
  .set-lock { display: none; flex: none; color: var(--text-3); }
  .set-lock svg { display: block; }
  .set-admin-item .li-sub { padding-right: 4px; }
  body[data-state="readonly"] .set-admin-item { pointer-events: none; }
  body[data-state="readonly"] .set-admin-item .li-text { opacity: .72; }
  body[data-state="readonly"] .set-admin-item .chevron { display: none; }
  body[data-state="readonly"] .set-admin-item .set-lock { display: inline-flex; }
  body[data-state="readonly"] .set-flag { background: var(--warning-soft); color: var(--warning); }
  .set-ro-note {
    display: none; align-items: flex-start; gap: 8px;
    margin-top: 12px; padding: 12px 14px;
    border-radius: var(--radius-md);
    background: var(--warning-soft); color: var(--warning);
    font-size: var(--fs-12); line-height: var(--lh-loose);
  }
  body[data-state="readonly"] .set-ro-note { display: flex; }
  .set-ro-note svg { flex: none; margin-top: 2px; }
  .set-dnd-value { flex: none; font-size: var(--fs-13); color: var(--text-2); font-family: var(--font-num); }
  .set-foot { margin: 14px 2px 0; line-height: var(--lh-loose); }
  .set-sk { display: none; padding-top: 8px; }
  .set-sk .sk-block { height: 76px; }
  body[data-state="loading"] .set-body { display: none; }
  body[data-state="loading"] .set-sk { display: block; }
</style>
</head>
<body data-screen="27 设置" data-tab="" data-states="default,dark,readonly,loading">
<div class="harness"></div>

<div class="phone">
  <div class="statusbar">
    <span class="num">9:41</span>
    <span class="sb-right">
      <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" width="3" height="11" rx="1"/></svg>
      <svg width="16" height="11" viewBox="0 0 16 11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M1 4.2a10 10 0 0 1 14 0"/><path d="M3.6 6.8a6.4 6.4 0 0 1 8.8 0"/><circle cx="8" cy="9.4" r="1" fill="currentColor" stroke="none"/></svg>
      <svg width="24" height="11" viewBox="0 0 24 11" fill="none"><rect x=".5" y=".5" width="20" height="10" rx="3" stroke="currentColor" opacity=".5"/><rect x="2.5" y="2.5" width="14" height="6" rx="1.5" fill="currentColor"/><rect x="22" y="3.5" width="2" height="4" rx="1" fill="currentColor" opacity=".5"/></svg>
    </span>
  </div>

  <div class="navbar">
    <div class="nav-left">
      <button class="icon-btn" type="button" data-go="me.html" aria-label="返回">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4 6 10l6 6"/></svg>
      </button>
    </div>
    <div class="nav-title">设置</div>
    <div class="nav-right"></div>
  </div>

  <div class="content">
    <div class="set-body">
      <div class="set-intro">外观、时区、语言与免打扰只影响你这一台设备；币种与日期格式属于家庭级设置，改动会对全家庭生效。</div>

      <div class="section-title">外观</div>
      <div class="card set-theme" data-hot="①" data-hot-name="主题三态" data-hot-pos="top-right" data-hot-label="跟随系统 / 亮 / 暗三态切换即时生效，写本机 hc-proto-theme，不随账号同步、不进导出范围">
        <div class="set-theme-row">
          <div class="set-label">外观主题<span class="li-sub">三态切换即时生效，不离开本页</span></div>
          <div class="segmented" role="tablist">
            <button type="button" role="tab" aria-selected="true" data-theme-pick="system">跟随系统</button>
            <button type="button" role="tab" aria-selected="false" data-theme-pick="light">亮</button>
            <button type="button" role="tab" aria-selected="false" data-theme-pick="dark">暗</button>
          </div>
        </div>
        <div class="set-theme-note">已切换为暗色 · 当前页即时重绘，页面栈与筛选状态均保留</div>
      </div>

      <div class="section-title">区域与格式</div>
      <div class="list">
        <button class="list-item" type="button" data-toast="时区是本人偏好：只改本机时间显示，家庭账期与到期时间仍按家庭时区"
          data-hot="②" data-hot-name="时区" data-hot-pos="top-right" data-hot-label="本人偏好可写；只影响本机显示，不改家庭账期">
          <span class="li-icon">
            <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="10" cy="10" r="7"/><path d="M10 6.2V10l2.6 1.6"/></svg>
          </span>
          <span class="li-text">时区<span class="li-sub">本机显示 · Asia/Shanghai</span></span>
          <span class="chevron">›</span>
        </button>
        <button class="list-item set-admin-item" type="button" data-toast="币种为家庭级设置，修改后全家庭生效；P1 仅支持 CNY ¥"
          data-hot="③" data-hot-name="币种" data-hot-pos="top-right" data-hot-label="家庭级项，仅管理员可写；非管理员展示只读值与「需管理员」">
          <span class="li-icon">
            <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="10" cy="10" r="7"/><path d="M10 6v8M7.4 8.4h5.2M7.4 11.4h5.2"/></svg>
          </span>
          <span class="li-text">币种<span class="li-sub">CNY ¥ · 全家庭统一</span></span>
          <span class="set-flag">需管理员</span>
          <span class="set-lock" aria-hidden="true">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="3.5" y="7" width="9" height="6.5" rx="1.8"/><path d="M5.6 7V5.4a2.4 2.4 0 0 1 4.8 0V7"/></svg>
          </span>
          <span class="chevron">›</span>
        </button>
        <button class="list-item set-admin-item" type="button" data-toast="日期格式为家庭级设置，修改后列表、报表与导出表头统一"
          data-hot="④" data-hot-name="日期格式" data-hot-pos="top-right" data-hot-label="家庭级项，仅管理员可写；只读态显示锁定说明">
          <span class="li-icon">
            <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="3.5" y="4.5" width="13" height="12" rx="2"/><path d="M3.5 8.5h13M7 3.5v2.4M13 3.5v2.4"/></svg>
          </span>
          <span class="li-text">日期格式<span class="li-sub">2026-10-06 · 全家庭统一</span></span>
          <span class="set-flag">需管理员</span>
          <span class="set-lock" aria-hidden="true">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="3.5" y="7" width="9" height="6.5" rx="1.8"/><path d="M5.6 7V5.4a2.4 2.4 0 0 1 4.8 0V7"/></svg>
          </span>
          <span class="chevron">›</span>
        </button>
        <button class="list-item" type="button" data-toast="P1 仅提供简体中文；多语言在 P6 末统一交付"
          data-hot="⑤" data-hot-name="语言" data-hot-pos="top-right" data-hot-label="本人偏好；P1 只出简体中文，不自造页面级语言切换">
          <span class="li-icon">
            <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="10" cy="10" r="7"/><path d="M3.4 10h13.2M10 3c1.9 2 2.8 4.4 2.8 7S11.9 15 10 17c-1.9-2-2.8-4.4-2.8-7S8.1 5 10 3z"/></svg>
          </span>
          <span class="li-text">语言<span class="li-sub">简体中文</span></span>
          <span class="chevron">›</span>
        </button>
      </div>

      <div class="section-title">通知</div>
      <div class="list">
        <div class="list-item" data-hot="⑥" data-hot-name="免打扰开关" data-hot-pos="top-right" data-hot-label="开启后时段内不发声；红点与未读计数照常，进入消息页仍会清零">
          <span class="li-icon">
            <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8.5a5 5 0 0 1 10 0c0 3 .8 4.2 1.4 5H3.6c.6-.8 1.4-2 1.4-5z"/><path d="M8 16.2a2.2 2.2 0 0 0 4 0"/><path d="M3.6 3.6 16.4 16.4"/></svg>
          </span>
          <span class="li-text">免打扰<span class="li-sub">时段内不发声，红点照常显示</span></span>
          <label class="switch"><input type="checkbox" checked id="dnd-switch"><span class="track"></span><span class="thumb"></span></label>
        </div>
        <button class="list-item" type="button" data-toast="免打扰时段 22:00–07:00；跨天时段按结束时间落在次日"
          data-hot="⑦" data-hot-name="免打扰时段" data-hot-pos="top-right" data-hot-label="时段端点可改；跨天按结束时间次日计算，开启后立即生效">
          <span class="li-icon">
            <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M15.5 12.2A6.5 6.5 0 0 1 7.8 4.5a6.5 6.5 0 1 0 7.7 7.7z"/></svg>
          </span>
          <span class="li-text">免打扰时段<span class="li-sub">每天 · 跨天</span></span>
          <span class="set-dnd-value">22:00–07:00</span>
          <span class="chevron">›</span>
        </button>
      </div>
      <div class="tiny set-foot">免打扰只影响声音与横幅，站内信、未读红点与角标不受影响；系统通知权限关闭时，本页设置不生效。</div>

      <div class="set-ro-note" role="status">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="8" cy="8" r="6"/><path d="M8 5v3.6M8 10.8v.1"/></svg>
        <span>币种与日期格式属于家庭级设置，仅管理员可修改。当前为只读视图，改动请联系家庭管理员。</span>
      </div>
    </div>

    <div class="set-sk" aria-hidden="true">
      <div class="skeleton sk-block"></div>
      <div class="skeleton sk-line" style="width:36%"></div>
      <div class="skeleton sk-block"></div>
      <div class="skeleton sk-line" style="width:52%"></div>
      <div class="skeleton sk-block"></div>
    </div>
  </div>

  <div class="toast"></div>
</div>

<script>
  var state = new URLSearchParams(location.search).get('state') || 'default';

  function selectTheme(v) {
    document.querySelectorAll('[data-theme-pick]').forEach(function (b) {
      b.setAttribute('aria-selected', String(b.getAttribute('data-theme-pick') === v));
    });
  }

  document.querySelectorAll('[data-theme-pick]').forEach(function (b) {
    b.addEventListener('click', function () {
      var v = b.getAttribute('data-theme-pick');
      window.HC.setTheme(v);
      selectTheme(v);
      window.HC.toast(v === 'system' ? '已跟随系统外观' : (v === 'light' ? '已切换为亮色' : '已切换为暗色'));
    });
  });

  var pref = localStorage.getItem('hc-proto-theme') || 'system';
  if (state === 'dark') {
    pref = 'dark';
    document.addEventListener('DOMContentLoaded', function () {
      window.HC.setTheme('dark');
    });
  }
  selectTheme(pref);

  var dnd = document.getElementById('dnd-switch');
  dnd.addEventListener('change', function () {
    window.HC.toast(dnd.checked ? '免打扰已开启' : '免打扰已关闭');
  });

  if (state === 'readonly') {
    document.querySelectorAll('.set-admin-item').forEach(function (b) {
      b.setAttribute('aria-disabled', 'true');
      b.tabIndex = -1;
    });
  }
</script>
</body>
</html>
