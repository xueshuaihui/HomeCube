<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>事件详情 · 家立方原型</title>
<link rel="stylesheet" href="shared/tokens.css">
<link rel="stylesheet" href="shared/base.css">
<script src="shared/app.js" defer></script>
<style>
  .cal-detail { padding-bottom: 12px; }

  .cal-cache {
    display: none; align-items: center; gap: 6px;
    margin-bottom: 10px; padding: 7px 10px;
    border-radius: var(--radius-sm);
    background: var(--warning-soft); color: var(--warning);
    font-size: var(--fs-12);
  }
  body[data-state="offline"] .cal-cache { display: flex; }
  body[data-state="offline"] .offline-bar { display: flex; }

  .cal-hero {
    margin-top: 4px; padding: 18px 20px 20px;
    border-radius: var(--radius-xl);
    background: linear-gradient(135deg, var(--brand-soft) 0%, var(--surface) 68%);
    border: 1px solid var(--brand-soft-border);
  }
  .cal-hero-date { font-size: var(--fs-12); color: var(--text-2); }
  .cal-hero-time {
    display: inline-block; margin-top: 6px;
    font-size: var(--fs-30); font-weight: 700; letter-spacing: -.01em; line-height: 1.1;
  }
  .cal-hero-title { margin-top: 4px; font-size: var(--fs-20); font-weight: 700; }
  .cal-hero-meta { margin-top: 10px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

  .cal-src {
    display: inline-flex; align-items: center; gap: 3px;
    padding: 1px 6px; border-radius: var(--radius-pill);
    font-size: var(--fs-11); font-weight: 600; white-space: nowrap;
  }
  .cal-src-fin { background: var(--brand-soft); color: var(--brand-text); }
  .cal-src-os { background: var(--accent-soft); color: var(--accent); }
  .cal-src-suffix { display: none; font-weight: 500; }
  body[data-state="sourceUnavailable"] .cal-src-fin { background: var(--surface-2); color: var(--text-3); }
  body[data-state="sourceUnavailable"] .cal-src-suffix { display: inline; }
  .cal-st {
    padding: 1px 6px; border-radius: var(--radius-pill);
    font-size: var(--fs-11); font-weight: 600; white-space: nowrap;
  }
  .cal-st-wait { background: var(--warning-soft); color: var(--warning); }
  .cal-st-todo { background: var(--info-soft); color: var(--info); }

  .cal-sec-title {
    margin: 20px 2px 8px;
    font-size: var(--fs-13); font-weight: 700; color: var(--text-2);
  }

  .cal-related {
    display: flex; align-items: center; gap: 12px;
    padding: 14px; background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius-lg);
  }
  .cal-rel-icon {
    width: 38px; height: 38px; flex: none;
    border-radius: 11px;
    display: flex; align-items: center; justify-content: center;
    background: var(--brand-soft); color: var(--brand-text);
  }
  .cal-rel-os { display: none; }
  body[data-state="calendar"] .cal-rel-fin { display: none; }
  body[data-state="calendar"] .cal-rel-os { display: block; }
  body[data-state="calendar"] .cal-rel-icon { background: var(--accent-soft); color: var(--accent); }
  .cal-rel-body { flex: 1; min-width: 0; }
  .cal-rel-title { font-size: var(--fs-15); font-weight: 600; }
  .cal-rel-sub { margin-top: 2px; font-size: var(--fs-12); color: var(--text-3); }
  .cal-rel-amount { flex: none; font-size: var(--fs-15); }

  .cal-rows {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-lg); overflow: hidden;
  }
  .cal-row { display: flex; align-items: flex-start; gap: 12px; padding: 13px 16px; font-size: var(--fs-14); }
  .cal-row + .cal-row { border-top: 1px solid var(--border); }
  .cal-k { width: 64px; flex: none; font-size: var(--fs-13); color: var(--text-3); }
  .cal-v { flex: 1; min-width: 0; }
  .cal-v-sub { display: block; margin-top: 3px; font-size: var(--fs-12); color: var(--text-3); line-height: var(--lh-normal); }
  .cal-people { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .cal-person { display: inline-flex; align-items: center; gap: 8px; font-size: var(--fs-13); }
  .cal-person .avatar { width: 28px; height: 28px; font-size: var(--fs-11); }

  .cal-foot {
    flex: none;
    padding: 10px 16px 16px;
    background: var(--surface);
    border-top: 1px solid var(--border);
  }
  .cal-unavail {
    display: none; align-items: flex-start; gap: 6px;
    margin-bottom: 10px;
    font-size: var(--fs-12); color: var(--warning); line-height: var(--lh-normal);
  }
  .cal-unavail svg { flex: none; margin-top: 2px; }
  body[data-state="sourceUnavailable"] .cal-unavail { display: flex; }
  body[data-state="sourceUnavailable"] .cal-go {
    background: var(--surface-2); color: var(--text-3); pointer-events: none;
  }
  .cal-foot-note { margin-top: 8px; text-align: center; line-height: var(--lh-normal); }
</style>
</head>
<body data-screen="11 事件详情 · 日历面" data-tab="" data-states="default,calendar,sourceUnavailable,offline">
<div class="harness"></div>

<div class="phone">
  <div class="statusbar">
    <span class="num">9:41</span>
    <span class="sb-right">
      <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" width="3" height="11" rx="1"/></svg>
      <svg width="16" height="11" viewBox="0 0 16 11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M1 4.2a10 10 0 0 1 14 0"/><path d="M3.6 6.8a6.4 6.4 0 0 1 8.8 0"/><circle cx="8" cy="9.4" r="1" fill="currentColor" stroke="none"/></svg>
      <svg width="24" height="11" viewBox="0 0 24 11" fill="none"><rect x=".5" y=".5" width="20" height="10" rx="3" stroke="currentColor" opacity=".5"/><rect x="2.5" y="2.5" width="14" height="6" rx="1.5" fill="currentColor"/><rect x="22" y="3.5" width="2" height="4" rx="1" fill="currentColor" opacity=".5"/></svg>
    </span>
  </div>

  <div class="navbar">
    <div class="nav-left">
      <button class="icon-btn" type="button" data-go="calendar.html"
        data-hot="①" data-hot-name="返回" data-hot-pos="outer-top-left"
        data-hot-label="回到到期中心并保持进入前的视图与日期；详情不做页内返回栈" aria-label="返回">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4 6 10l6 6"/></svg>
      </button>
    </div>
    <div class="nav-title">事件详情</div>
    <div class="nav-right"></div>
  </div>

  <div class="offline-bar">
    <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2 8a6 6 0 0 1 12 0"/><path d="M2 2l12 12"/></svg>
    当前离线 · 摘要为缓存
  </div>

  <div class="content cal-detail">
    <div class="cal-cache">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="8" cy="8" r="5.5"/><path d="M8 4.8V8l2.2 1.3"/></svg>
      显示本机缓存 · 截至 10 月 29 日 08:10
    </div>

    <section class="cal-hero">
      <div class="cal-hero-when"
        data-hot="④" data-hot-name="时间" data-hot-pos="outer-top-right"
        data-hot-label="按家庭时区格式化；重复事件这里只描述当前这一次，周期规则在提醒设置里只读展示">
        <div class="cal-hero-date num">2026 年 10 月 29 日 · 周四</div>
        <div class="cal-hero-time num">20:00</div>
      </div>
      <h2 class="cal-hero-title">交物业费</h2>
      <div class="cal-hero-meta">
        <span class="cal-src cal-src-fin cal-hero-src"
          data-hot="③" data-hot-name="来源标注" data-hot-pos="outer-bottom-right"
          data-hot-label="来源系统由注册时的 source_system 决定，不按标题猜；P1 只可能是 日历 或 财务">财务<span class="cal-src-suffix"> · 暂不可用</span></span>
        <span class="cal-st cal-st-wait cal-hero-status">待缴</span>
      </div>
    </section>

    <div class="cal-sec-title">关联对象</div>
    <div class="cal-related">
      <span class="cal-rel-icon">
        <svg class="cal-rel-fin" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4.5" width="15" height="11" rx="2.5"/><path d="M2.5 8h15"/><path d="M6 12h3"/></svg>
        <svg class="cal-rel-os" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="14" height="13" rx="2.5"/><path d="M7 8.5h6M7 12h4"/></svg>
      </span>
      <div class="cal-rel-body">
        <div class="cal-rel-title" id="rel-title">账单 · 物业费</div>
        <div class="cal-rel-sub" id="rel-sub">2026 年 10 月 · 每月 29 日到期</div>
      </div>
      <span class="amount cal-rel-amount" id="rel-amount">-¥380.00</span>
    </div>

    <div class="cal-sec-title">事件信息</div>
    <div class="cal-rows">
      <div class="cal-row">
        <span class="cal-k">来源系统</span>
        <span class="cal-v" id="row-source">财务 · 账单</span>
      </div>
      <div class="cal-row">
        <span class="cal-k">提醒设置</span>
        <span class="cal-v">
          <span id="row-remind">提前 3 天 · 当天 20:00 · 站内信</span>
          <span class="cal-v-sub">提醒由 HomeOS 统一下发，源面不自建推送；在本页只读。</span>
        </span>
      </div>
      <div class="cal-row"
        data-hot="⑤" data-hot-name="参与人" data-hot-pos="top-right"
        data-hot-label="取注册时携带的 participants[]，只读；无账号成员与有账号成员呈现一致">
        <span class="cal-k">参与人</span>
        <span class="cal-v cal-people">
          <span class="cal-person"><span class="avatar">我</span>我<span class="tiny">负责人</span></span>
          <span class="cal-person"><span class="avatar">妈</span>妈妈</span>
        </span>
      </div>
    </div>
  </div>

  <div class="cal-foot">
    <div class="cal-unavail">
      <svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="10" cy="10" r="7"/><path d="M10 6.2v4.6M10 13.4v.1"/></svg>
      <span>该面暂不可用，先看摘要；源面恢复后可从这里前往。</span>
    </div>
    <a class="btn btn-primary btn-block cal-go" id="go" href="finance-bill-detail.html"
      data-hot="②" data-hot-name="前往源对象" data-hot-pos="bottom-right"
      data-hot-label="source_system / source_id 决定深链：财务账单进财务账单详情；日历自带对象回本面内页（待办 → calendar/todo/detail，日程 → 本页）；源面不可用时禁用">
      前往源对象
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h8M8.8 4.8 12 8l-3.2 3.2"/></svg>
    </a>
    <div class="tiny cal-foot-note" id="footnote">在源对象里完成后，到期中心与首页今日区会同步更新</div>
  </div>

  <div class="toast"></div>
</div>

<script>
  var state = new URLSearchParams(location.search).get('state') || 'default';
  var go = document.getElementById('go');

  if (state === 'sourceUnavailable') {
    go.setAttribute('aria-disabled', 'true');
  }

  if (state === 'calendar') {
    document.querySelector('.cal-hero-time').textContent = '16:30';
    document.querySelector('.cal-hero-title').textContent = '接女儿放学';

    var src = document.querySelector('.cal-hero-src');
    src.className = 'cal-src cal-src-os cal-hero-src';
    src.textContent = '日历';

    var st = document.querySelector('.cal-hero-status');
    st.className = 'cal-st cal-st-todo cal-hero-status';
    st.textContent = '待处理';

    document.getElementById('rel-title').textContent = '待办 · 接女儿放学';
    document.getElementById('rel-sub').textContent = '家庭待办 · 负责人 我';
    document.getElementById('rel-amount').style.display = 'none';
    document.getElementById('row-source').textContent = '日历 · 待办';
    document.getElementById('row-remind').textContent = '当天 16:15 · 提前 15 分钟 · 站内信';
    document.getElementById('footnote').textContent = '回到到期中心即可继续处理这条待办';

    go.setAttribute('href', 'todo-detail.html');
  }
</script>
</body>
</html>
