<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>新建分类 · 家立方原型</title>
<link rel="stylesheet" href="shared/tokens.css">
<link rel="stylesheet" href="shared/base.css">
<script src="shared/app.js" defer></script>
<style>
  .fx-content { padding-bottom: 20px; }
  .fx-lead { margin: 4px 2px 14px; font-size: var(--fs-12); color: var(--text-3); line-height: var(--lh-normal); }

  .fx-parent-row { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px 0 4px; }
  .fx-parent-row::-webkit-scrollbar { display: none; }
  .fx-parent-row .chip { border: 1px solid var(--border); background: var(--surface); }
  .fx-parent-row .chip[aria-pressed="true"] {
    background: var(--brand-soft); border-color: var(--brand-soft-border); color: var(--brand-text);
  }

  .fx-icon-field {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 12px;
    border: 1px solid var(--border); border-radius: var(--radius-md);
    background: var(--surface);
  }
  .fx-icon-preview {
    width: 44px; height: 44px; flex: none;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    background: var(--brand-soft); color: var(--brand-text);
  }
  .fx-icon-meta { flex: 1; min-width: 0; }
  .fx-icon-name { font-size: var(--fs-14); font-weight: 600; }
  .fx-icon-sub { margin-top: 2px; font-size: var(--fs-11); color: var(--text-3); }
  .fx-icon-swap {
    flex: none; height: 32px; padding: 0 12px;
    border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
    background: var(--surface); color: var(--text);
    font-family: inherit; font-size: var(--fs-13); font-weight: 600;
    cursor: pointer;
  }
  .fx-icon-swap:hover { background: var(--surface-2); }

  .fx-icon-grid { display: none; margin-top: 10px; }
  .fx-field.is-picker .fx-icon-grid { display: block; }

  .fx-name-error { display: none; }
  body[data-state="error"] .fx-name-error { display: flex; }
  body[data-state="error"] .fx-lead { color: var(--text-2); }
  .fx-icon-grid-inner {
    display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px;
    padding: 10px; border: 1px solid var(--border); border-radius: var(--radius-md);
    background: var(--surface);
  }
  .fx-icon-cell {
    height: 46px; border-radius: 10px;
    border: 1px solid transparent; background: var(--surface-2); color: var(--text-2);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; padding: 0;
  }
  .fx-icon-cell:hover { border-color: var(--border-strong); }
  .fx-icon-cell[aria-pressed="true"] {
    background: var(--brand-soft); color: var(--brand-text);
    border-color: var(--brand-soft-border);
    box-shadow: inset 0 0 0 1px var(--brand-soft-border);
  }
  .fx-icon-note { margin-top: 6px; font-size: var(--fs-11); color: var(--text-3); line-height: var(--lh-normal); }

  .fx-swatches { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .fx-swatch {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 10px;
    border: 1px solid var(--border); border-radius: var(--radius-md);
    background: var(--surface); color: var(--text-2);
    font-family: inherit; font-size: var(--fs-12); font-weight: 600;
    cursor: pointer;
  }
  .fx-swatch .fx-dot { width: 18px; height: 18px; border-radius: 50%; flex: none; display: block; }
  .fx-swatch[aria-pressed="true"] { border-color: var(--text); color: var(--text); }
  .fx-swatch[aria-pressed="true"] .fx-dot { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--text-3); }

  .fx-type { display: flex; }
  .fx-type .segmented { width: 100%; }
  .fx-type .segmented button { flex: 1; padding: 8px 6px; }

  .fx-preview {
    margin-top: 4px; padding: 12px 14px;
    border: 1px dashed var(--border-strong); border-radius: var(--radius-md);
    background: var(--bg);
    display: flex; align-items: center; gap: 10px;
  }
  .fx-preview .fx-icon-preview { width: 34px; height: 34px; border-radius: 10px; }
  .fx-preview-txt { flex: 1; min-width: 0; }
  .fx-preview-name { font-size: var(--fs-14); font-weight: 600; }
  .fx-preview-sub { margin-top: 2px; font-size: var(--fs-11); color: var(--text-3); }
  .fx-preview-amt { font-size: var(--fs-14); color: var(--text-2); }

  .fx-footer {
    flex: none;
    display: flex; gap: 10px;
    padding: 10px 16px 16px;
    background: var(--surface);
    border-top: 1px solid var(--border);
  }
  .fx-footer .btn { flex: 1; }
</style>
</head>
<body data-screen="F14 新建分类" data-states="default,picker,error">
<div class="harness"></div>

<div class="phone">
  <div class="statusbar">
    <span class="num">9:41</span>
    <span class="sb-right">
      <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" width="3" height="11" rx="1"/></svg>
      <svg width="16" height="11" viewBox="0 0 16 11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M1 4.2a10 10 0 0 1 14 0"/><path d="M3.6 6.8a6.4 6.4 0 0 1 8.8 0"/><circle cx="8" cy="9.4" r="1" fill="currentColor" stroke="none"/></svg>
      <svg width="24" height="11" viewBox="0 0 24 11" fill="none"><rect x=".5" y=".5" width="20" height="10" rx="3" stroke="currentColor" opacity=".5"/><rect x="2.5" y="2.5" width="14" height="6" rx="1.5" fill="currentColor"/><rect x="22" y="3.5" width="2" height="4" rx="1" fill="currentColor" opacity=".5"/></svg>
    </span>
  </div>

  <header class="navbar">
    <div class="nav-left">
      <a class="icon-btn" href="finance-category.html" aria-label="返回分类管理"
        data-hot="①" data-hot-name="返回" data-hot-pos="outer-top-left"
        data-hot-label="回分类管理 finance/category/index；未保存的输入直接丢弃，不回填草稿（分类只有名称/图标/颜色/父级四项，重填成本低）">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4 6 10l6 6"/></svg>
      </a>
    </div>
    <div class="nav-title">新建分类</div>
    <div class="nav-right"></div>
  </header>

  <div class="offline-bar">
    <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2 8a6 6 0 0 1 12 0"/><path d="M2 2l12 12"/></svg>
    当前离线 · 新建后先排队，联网自动提交
  </div>

  <div class="content bottom-space fx-content">
    <p class="fx-lead">同一父级下不可重名；分类只有两级，二级不能再挂子分类。</p>

    <div class="field">
      <label class="field-label" for="fx-name">名称</label>
      <input class="input" id="fx-name" value="" placeholder="如：宠物、健身"
        data-hot="②" data-hot-name="名称" data-hot-label="1-10 个字符；同一父级下重名即报错，不给「仍然创建」。首尾空格自动去掉"
        data-hot-pos="outer-top-right">
      <div class="field-error fx-name-error">
        <svg width="13" height="13" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="10" cy="10" r="7.5"/><path d="M10 6.4v4.6M10 13.6v.1"/></svg>
        本家庭已有同名一级分类「餐饮」，换个名字或把它选为父级
      </div>
    </div>

    <div class="field">
      <span class="field-label">父级</span>
      <div class="fx-parent-row"
        data-hot="③" data-hot-name="父级" data-hot-pos="outer-top-right"
        data-hot-label="「无」= 建一级分类；选任一未停用的一级分类则建它的二级。已停用的一级不出现在这里">
        <button class="chip" type="button" aria-pressed="true" data-parent>无（一级）</button>
        <button class="chip" type="button" aria-pressed="false" data-parent>餐饮</button>
        <button class="chip" type="button" aria-pressed="false" data-parent>交通</button>
        <button class="chip" type="button" aria-pressed="false" data-parent>居家</button>
        <button class="chip" type="button" aria-pressed="false" data-parent>其他</button>
        <button class="chip" type="button" aria-pressed="false" data-parent>工资</button>
      </div>
      <div class="help">选父级后，新分类出现在该分类展开的二级里；父级停用不影响已建的二级。</div>
    </div>

    <div class="field fx-field">
      <span class="field-label">图标</span>
      <div class="fx-icon-field"
        data-hot="④" data-hot-name="图标" data-hot-pos="outer-top-right"
        data-hot-label="图标只从统一图标集里选，禁用 emoji；「更换图标」就地展开 18 枚网格，选中项高亮，不跳页">
        <span class="fx-icon-preview" id="fx-icon-preview">
          <svg width="22" height="22" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 10.5h13"/><path d="M4.5 10.5a5.5 5.5 0 0 1 11 0"/><path d="M8 7.5 6.5 4.5M12 7.5l1.5-3"/></svg>
        </span>
        <span class="fx-icon-meta">
          <span class="fx-icon-name" id="fx-icon-name">餐具</span>
          <span class="fx-icon-sub">统一图标集 · 线性 1.7px</span>
        </span>
        <button class="fx-icon-swap" type="button" id="fx-icon-swap">更换图标</button>
      </div>

      <div class="fx-icon-grid">
        <div class="fx-icon-grid-inner" role="group" aria-label="统一图标集">
          <button class="fx-icon-cell" type="button" aria-pressed="true" aria-label="餐具">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 10.5h13"/><path d="M4.5 10.5a5.5 5.5 0 0 1 11 0"/><path d="M8 7.5 6.5 4.5M12 7.5l1.5-3"/></svg>
          </button>
          <button class="fx-icon-cell" type="button" aria-pressed="false" aria-label="汽车">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12.5h13l-1.2 3.2a1.5 1.5 0 0 1-1.4 1H6.1a1.5 1.5 0 0 1-1.4-1z"/><path d="M5.5 12.5l1.6-5.2A2 2 0 0 1 9 6h2a2 2 0 0 1 1.9 1.3l1.6 5.2"/></svg>
          </button>
          <button class="fx-icon-cell" type="button" aria-pressed="false" aria-label="住房">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 9.5 10 4l6.5 5.5V16a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1z"/><path d="M8 17v-4.5h4V17"/></svg>
          </button>
          <button class="fx-icon-cell" type="button" aria-pressed="false" aria-label="书本">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.5h5.5A2.5 2.5 0 0 1 12 7v9a2 2 0 0 0-2-2H4z"/><path d="M16 4.5h-5.5A2.5 2.5 0 0 0 8 7v9a2 2 0 0 1 2-2h6z"/></svg>
          </button>
          <button class="fx-icon-cell" type="button" aria-pressed="false" aria-label="礼物">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="7" width="13" height="8.5" rx="1.5"/><path d="M3.5 10.5h13"/><path d="M10 3.5v3.5"/><path d="M7 3.5h6"/></svg>
          </button>
          <button class="fx-icon-cell" type="button" aria-pressed="false" aria-label="钱包">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="14" height="10" rx="2"/><path d="M3 9h14"/><path d="M6.5 13h3"/></svg>
          </button>
          <button class="fx-icon-cell" type="button" aria-pressed="false" aria-label="图表">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 15.5h13"/><path d="M5 15.5V10M9 15.5V6.5M13 15.5V9M17 15.5V4.5"/></svg>
          </button>
          <button class="fx-icon-cell" type="button" aria-pressed="false" aria-label="心形">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 16s-6-3.6-6-7.6A3.4 3.4 0 0 1 10 6.3 3.4 3.4 0 0 1 16 8.4c0 4-6 7.6-6 7.6z"/></svg>
          </button>
          <button class="fx-icon-cell" type="button" aria-pressed="false" aria-label="爪印">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="7" r="1.6"/><circle cx="10" cy="5.4" r="1.6"/><circle cx="14" cy="7" r="1.6"/><path d="M10 9.5c2.6 0 4.4 1.7 4.4 3.4S12.6 16 10 16s-4.4-1.4-4.4-3.1S7.4 9.5 10 9.5z"/></svg>
          </button>
          <button class="fx-icon-cell" type="button" aria-pressed="false" aria-label="飞机">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 17 5l-4 11-3-3.5-2.5 2 .4-3.6z"/></svg>
          </button>
          <button class="fx-icon-cell" type="button" aria-pressed="false" aria-label="咖啡">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h10v5a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3z"/><path d="M14 9h1.5a2 2 0 0 1 0 4H14"/><path d="M6.5 4v2M10 4v2"/></svg>
          </button>
          <button class="fx-icon-cell" type="button" aria-pressed="false" aria-label="购物袋">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h10l1 9H4z"/><path d="M7.5 7V6a2.5 2.5 0 0 1 5 0v1"/></svg>
          </button>
          <button class="fx-icon-cell" type="button" aria-pressed="false" aria-label="医疗">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="12" height="12" rx="3"/><path d="M10 7.5v5M7.5 10h5"/></svg>
          </button>
          <button class="fx-icon-cell" type="button" aria-pressed="false" aria-label="手机">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="3" width="8" height="14" rx="2"/><path d="M9 14.5h2"/></svg>
          </button>
          <button class="fx-icon-cell" type="button" aria-pressed="false" aria-label="音符">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M13 4v8"/><path d="M13 4l4-1v8"/><circle cx="11" cy="12.5" r="2"/><circle cx="15" cy="11.5" r="2"/></svg>
          </button>
          <button class="fx-icon-cell" type="button" aria-pressed="false" aria-label="婴儿">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="9" r="5.5"/><path d="M8 8v.1M12 8v.1"/><path d="M8.5 11a2.2 2.2 0 0 0 3 0"/><path d="M10 3.5V2"/></svg>
          </button>
          <button class="fx-icon-cell" type="button" aria-pressed="false" aria-label="工具">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 4.5a3.5 3.5 0 0 1 4.2 4.6l-8 8-2.8-2.8 8-8"/><path d="M5.5 14.5 3.5 16.5"/></svg>
          </button>
          <button class="fx-icon-cell" type="button" aria-pressed="false" aria-label="星标">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3.5l2 4.2 4.5.6-3.3 3.2.8 4.5L10 14l-4 2 .8-4.5L3.5 8.3l4.5-.6z"/></svg>
          </button>
        </div>
        <p class="fx-icon-note">图标来自统一图标集，与分类同行显示；不支持 emoji（15.7 的 CI 闸门会拦）。</p>
      </div>
    </div>

    <div class="field">
      <span class="field-label">颜色</span>
      <div class="fx-swatches"
        data-hot="⑤" data-hot-name="颜色" data-hot-pos="outer-top-right"
        data-hot-label="只能从令牌色板里选（8 枚），不提供色值输入框；选中的颜色用于分类图标底色，亮暗两套值都由令牌给">
        <button class="fx-swatch" type="button" aria-pressed="true"><span class="fx-dot" style="background:var(--brand-500)"></span>暖橙</button>
        <button class="fx-swatch" type="button" aria-pressed="false"><span class="fx-dot" style="background:var(--accent-500)"></span>橄榄</button>
        <button class="fx-swatch" type="button" aria-pressed="false"><span class="fx-dot" style="background:var(--info)"></span>靛蓝</button>
        <button class="fx-swatch" type="button" aria-pressed="false"><span class="fx-dot" style="background:var(--face-calendar)"></span>青绿</button>
        <button class="fx-swatch" type="button" aria-pressed="false"><span class="fx-dot" style="background:var(--warning)"></span>琥珀</button>
        <button class="fx-swatch" type="button" aria-pressed="false"><span class="fx-dot" style="background:var(--success)"></span>松绿</button>
        <button class="fx-swatch" type="button" aria-pressed="false"><span class="fx-dot" style="background:var(--danger)"></span>砖红</button>
        <button class="fx-swatch" type="button" aria-pressed="false"><span class="fx-dot" style="background:var(--av-3)"></span>藤紫</button>
      </div>
    </div>

    <div class="field">
      <span class="field-label">类型</span>
      <div class="fx-type"
        data-hot="⑥" data-hot-name="类型" data-hot-pos="outer-top-right"
        data-hot-label="支出 / 收入二选一，决定分类出现在记账选择器的哪个页签；建好后不可改类型（要换只能另建并停用旧项）">
        <div class="segmented" role="tablist">
          <button type="button" role="tab" aria-selected="true" data-type="out">支出</button>
          <button type="button" role="tab" aria-selected="false" data-type="in">收入</button>
        </div>
      </div>
    </div>

    <div class="field">
      <span class="field-label">预览</span>
      <div class="fx-preview">
        <span class="fx-icon-preview" id="fx-preview-icon">
          <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 10.5h13"/><path d="M4.5 10.5a5.5 5.5 0 0 1 11 0"/><path d="M8 7.5 6.5 4.5M12 7.5l1.5-3"/></svg>
        </span>
        <span class="fx-preview-txt">
          <span class="fx-preview-name" id="fx-preview-name">未命名分类</span>
          <span class="fx-preview-sub" id="fx-preview-sub">一级 · 支出</span>
        </span>
        <span class="fx-preview-amt num" id="fx-preview-amt">-¥0.00</span>
      </div>
    </div>
  </div>

  <div class="fx-footer">
    <a class="btn btn-secondary" href="finance-category.html">取消</a>
    <button class="btn btn-primary" type="button"
      data-hot="⑦" data-hot-name="创建" data-hot-pos="outer-top-right"
      data-hot-label="校验通过才写入；名称重名时停在 error 态、按钮不生效。成功回到分类管理并展开其父级（一级则置顶新行）">创建分类</button>
  </div>

  <div class="toast"></div>
</div>

<script>
  (function () {
    var st = new URLSearchParams(location.search).get('state') || 'default';
    var field = document.querySelector('.fx-field');
    var swap = document.getElementById('fx-icon-swap');
    var nameInput = document.getElementById('fx-name');

    function syncPreview() {
      var t = document.getElementById('fx-preview-name');
      var sub = document.getElementById('fx-preview-sub');
      var amt = document.getElementById('fx-preview-amt');
      var val = (nameInput.value || '').trim();
      var parent = document.querySelector('[data-parent][aria-pressed="true"]');
      var type = document.querySelector('[data-type][aria-selected="true"]').getAttribute('data-type');
      t.textContent = val || '未命名分类';
      sub.textContent = (parent && parent.textContent.indexOf('无') !== 0 ? '二级 · ' : '一级 · ')
        + (type === 'in' ? '收入' : '支出');
      amt.textContent = type === 'in' ? '+¥0.00' : '-¥0.00';
    }

    swap.addEventListener('click', function () {
      var open = field.classList.toggle('is-picker');
      swap.textContent = open ? '收起图标' : '更换图标';
    });

    document.querySelectorAll('.fx-icon-cell').forEach(function (cell) {
      cell.addEventListener('click', function () {
        document.querySelectorAll('.fx-icon-cell').forEach(function (c) {
          c.setAttribute('aria-pressed', String(c === cell));
        });
        document.getElementById('fx-icon-preview').innerHTML = cell.innerHTML;
        document.getElementById('fx-preview-icon').innerHTML = cell.innerHTML;
        document.getElementById('fx-icon-name').textContent = cell.getAttribute('aria-label');
      });
    });

    document.querySelectorAll('.fx-swatch').forEach(function (s) {
      s.addEventListener('click', function () {
        document.querySelectorAll('.fx-swatch').forEach(function (x) {
          x.setAttribute('aria-pressed', String(x === s));
        });
      });
    });

    document.querySelectorAll('[data-parent]').forEach(function (c) {
      c.addEventListener('click', function () {
        document.querySelectorAll('[data-parent]').forEach(function (x) {
          x.setAttribute('aria-pressed', String(x === c));
        });
        syncPreview();
      });
    });

    document.querySelectorAll('[data-type]').forEach(function (b) {
      b.addEventListener('click', function () {
        document.querySelectorAll('[data-type]').forEach(function (x) {
          x.setAttribute('aria-selected', String(x === b));
        });
        syncPreview();
      });
    });

    nameInput.addEventListener('input', syncPreview);

    if (st === 'picker') {
      field.classList.add('is-picker');
      swap.textContent = '收起图标';
    } else {
      field.classList.remove('is-picker');
    }

    if (st === 'error') {
      nameInput.value = '餐饮';
      nameInput.classList.add('is-error');
      syncPreview();
    }
  })();
</script>
</body>
</html>
